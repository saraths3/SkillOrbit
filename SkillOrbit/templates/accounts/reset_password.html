{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password · SkillOrbit{% endblock %}

{% block extrastyle %}
  <link rel="stylesheet" href="{% static 'css/accounts/signin.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fas fa-circle-nodes"></i>
        <span>SkillOrbit</span>
      </div>
      <h1>Set New Password</h1>
      <p class="auth-subtitle">Please enter and confirm your new account password</p>
    </div>

    <form method="post" action="" class="auth-form">
      {% csrf_token %}

      <div class="input-group">
        <div class="input-wrapper">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" name="password" placeholder="New password" required autofocus>
        </div>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-key"></i> Update Password
      </button>
    </form>

    <div class="auth-footer">
      <p><a href="{% url 'signin' %}"><i class="fas fa-arrow-left"></i> Back to Sign In</a></p>
    </div>
  </div>
</div>
{% endblock %}
